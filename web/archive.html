<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会议详情</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="theme.css?v=2">
<style>
body{margin:0;padding:0 0 60px}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line,#e5e5e8);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:650;margin:0;flex:1;min-width:200px;letter-spacing:-.2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px}
.meta{font:12px var(--mono,ui-monospace,Menlo,monospace);color:var(--muted,#76767c);display:flex;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.meta b{color:var(--text,#202124);font-weight:500}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.pane{padding:0;overflow:hidden}
.pane h2{margin:0}
.pane .scroll{max-height:70vh;overflow:auto}
.tr p{margin:0 0 10px;font-size:14px;line-height:1.6}
.tr time{margin-right:8px}
.spk{display:inline-block;padding:0 6px;margin-right:6px;font-size:11px}
.orig{display:block;color:var(--muted,#76767c);font-size:12px;margin:-6px 0 10px 54px}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--panel-2,#f0f0f3);font-size:12px;color:var(--muted,#76767c)}
.empty{padding:12px 14px}
.cond-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12.5px;color:var(--muted)}
.cond-bar[hidden]{display:none}
.cond-bar button{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:999px;padding:3px 12px;font:inherit;font-size:12px;cursor:pointer}
.cond-bar button:hover{border-color:var(--live)}
.player-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.player-box .ph{font-size:12px;color:var(--muted)}
.player-box audio{height:32px;flex:1;min-width:220px}
button.k.play{cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
button.k.play:hover,time.play:hover{text-decoration:underline}
time.play{cursor:pointer}

.bf-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:start}
/* 平板竖屏（768）上下堆叠、平板横屏（1024）起左右并列；嵌在主界面的浮层里时页面比窗口窄 8vw，断点按内容宽算 */
@media(max-width:900px){.bf-grid{grid-template-columns:1fr}}
.bf-body{padding:14px;font-size:14px;line-height:1.65}
.pane h2{display:flex;align-items:center;gap:8px}
.bf-scope{color:var(--muted);margin:0 0 12px}
.bf-h{font:11px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.bf-h:first-child{margin-top:0}
.bf-topics{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.bf-topics li{display:flex;gap:8px;align-items:baseline}
.bf-n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--text);color:#fff;font:11px/20px var(--mono);text-align:center}
.bf-dur{margin-left:auto;color:var(--faint);font:11px var(--mono)}
.bf-bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--panel-2);margin:10px 0 2px}
.bf-bar i{display:block;height:100%;font:10px/22px var(--mono);font-style:normal;color:#fff;text-align:center;border-right:1px solid #fff;cursor:pointer;overflow:hidden}
.bf-bar i.gap{background:transparent;cursor:default}
.bf-key{background:#fff8e1;border-left:3px solid #e0a800;border-radius:6px;padding:8px 12px;margin:0 0 6px}
.bf-table{width:100%;border-collapse:collapse;font-size:13px}
.bf-table th{text-align:left;font:11px var(--mono);color:var(--muted);font-weight:400;padding:4px 8px;border-bottom:1px solid var(--line)}
.bf-table td{padding:7px 8px;border-bottom:1px solid #f0f0f2;vertical-align:top}
.bf-table td:nth-child(n+2),.bf-table th:nth-child(n+2){white-space:nowrap}
.bf-sug{color:var(--faint)}
.bf-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px}
.bf-card h3{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 8px;flex-wrap:wrap}
.bf-card h3 .bf-ttl{flex:1;min-width:0}
/* 议题的决定状态：徽标本身就是改它的按钮，点一下就地变成四个选项 */
.bf-dec{flex:none;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:999px;padding:1px 10px;font:11px var(--mono);cursor:pointer}
.bf-dec:hover{border-color:var(--live)}
.bf-dec.ok{background:#e6f4ea;color:#1e7e34;border-color:#cbe6d4}
.bf-dec.bad{background:#fdecea;color:#b3261e;border-color:#f3d3cf}
.bf-dec.mute{background:var(--panel-2);color:var(--faint)}
.bf-dec-pick{display:flex;flex-wrap:wrap;gap:6px}
.bf-dec-pick .bf-opt{font-size:12px;padding:2px 10px}
.bf-quote{color:var(--muted);font-size:12.5px;line-height:1.55;margin:3px 0 0}

.bf-card ul{margin:6px 0 0;padding-left:18px}.bf-card li{margin:3px 0}
.bf-open{color:var(--muted);font-size:13px;margin-top:8px}
.bf-t{border:0;background:var(--panel-2);color:var(--muted);font:11px var(--mono);border-radius:6px;padding:1px 6px;margin-left:6px;cursor:pointer}
.bf-item{border-bottom:1px solid #f0f0f2;padding:8px 0}.bf-item:last-child{border-bottom:0}
.bf-ins{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #f0f0f2;padding:8px 0;font-size:13.5px;line-height:1.5}.bf-ins:last-child{border-bottom:0}.bf-ins>div{min-width:0;flex:1}.bf-ins .bf-t{flex:none;white-space:nowrap;padding:3px 8px}
.bf-ho{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.bf-ho input{flex:1 1 120px;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line,#ddd);border-radius:6px;background:var(--panel-2)}
.bf-tt td{vertical-align:top;font-size:13px;line-height:1.45}.bf-tt td:nth-child(2){min-width:120px}.bf-tt td:nth-child(3){min-width:140px}
.bf-topics-c li{align-items:flex-start}.bf-topics-c li>div{flex:1;min-width:0}.bf-topic-c{color:var(--muted);font-size:12.5px;margin-top:2px}.bf-ins .td-n{flex:none;width:18px;font:12px var(--mono);color:var(--faint);padding-top:2px}.bf-more summary{cursor:pointer;font-size:12px;color:var(--muted);margin-top:4px}
.bf-detail>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}.bf-detail>summary::-webkit-details-marker{display:none}.bf-detail>summary::before{content:'▸';color:var(--faint)}.bf-detail[open]>summary::before{content:'▾'}
.bf-q{color:var(--text)}.bf-src{color:var(--faint);font-size:12px;margin-top:3px}
.bf-tag{display:inline-block;font:11px var(--mono);border-radius:6px;padding:0 6px;margin-right:6px;background:var(--panel-2);color:var(--muted)}
.bf-tag.ok{background:#e6f4ea;color:#1e7e34}.bf-tag.bad{background:#fdecea;color:#b3261e}
.bf-note{color:var(--muted);font-size:13px}
/* 会后处理台（REQ-009）：一条事一张卡，一张卡一个主动作 + 一个「不认」。 */
/* 飞书纪要式：1 / 2 / 3 自动编号的节，议题再编 2.1 2.2；结论加粗在高亮块里 */
.fs{margin:0 0 18px}
.fs-h{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fs-n{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--text);color:#fff;font:12px/22px var(--mono);text-align:center}
.fs-n.sub{background:var(--panel-2);color:var(--text);font-size:11px}
.bf-key b{font-weight:650}
/* 待办表：一行一件事，动作在最后一列；展开的草稿占整行 */
.td-wrap{overflow-x:auto;margin:0 0 8px}
.td-table td{vertical-align:top}
.td-table .td-n{color:var(--muted);font:12px var(--mono);width:22px}
.td-table td:nth-child(2){white-space:normal;min-width:180px}
.td-table td:nth-child(3),.td-table td:nth-child(4){white-space:nowrap;color:var(--text)}
.td-table .td-act{white-space:nowrap;text-align:right}
.td-table .td-act .bf-go{margin-right:4px}
.td-table .td-act .bf-act-state{white-space:normal;max-width:180px;margin-top:4px;text-align:left}
tr.bf-act.done td{background:var(--panel-2);color:var(--muted)}
tr.bf-draft-row td{padding:0 8px 10px;border-bottom:1px solid #f0f0f2}
tr.bf-draft-row .bf-draft{border-top:0;margin-top:0;padding-top:0}
.bf-say{display:flex;gap:8px;align-items:center;margin:10px 0 4px}
.bf-say input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;background:#fff;color:var(--text)}
.bf-say input:focus{outline:none;border-color:var(--text)}
.bf-say button{flex:none;border:1px solid var(--text);background:var(--text);color:#fff;border-radius:10px;font:inherit;font-size:13px;padding:8px 14px;cursor:pointer}
.bf-say button[type=button]{background:var(--panel-2);color:var(--text);border-color:var(--line)}
.bf-say-log{font-size:13px;line-height:1.6;color:var(--text);margin:4px 0}
.bf-say-log.bad{color:#b3261e}
.bf-say-hint{color:var(--faint);font-size:12px;margin:2px 0 0}
@media(max-width:600px){.td-table td:nth-child(3),.td-table td:nth-child(4){white-space:normal}.td-table .td-act{white-space:normal}}
.bf-act-why{color:var(--muted);font-size:13px;margin-top:4px}
.bf-act-acts{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.bf-act-state{color:var(--muted);font-size:12px}.bf-act-state.bad{color:#b3261e}
.bf-x{flex:none;border:0;background:none;color:var(--faint);font-size:14px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:6px}
.bf-x:hover{background:#fdecea;color:#b3261e}
.bf-go{border:1px solid var(--text);background:var(--text);color:#fff;border-radius:8px;font-size:13px;padding:5px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.bf-go.done{background:none;color:var(--muted);border-color:var(--line);cursor:default}
.bf-tag.k-meeting{background:#e8f0fe;color:#1a56b8}.bf-tag.k-research{background:#f3e8fd;color:#6b2fb8}
.bf-tag.k-delegate{background:#fff4e5;color:#95590c}.bf-tag.k-self{background:#e6f4ea;color:#1e7e34}
.bf-draft{border-top:1px solid #f0f0f2;margin-top:10px;padding-top:10px;display:grid;gap:8px}
.bf-f{display:grid;gap:4px;font-size:13px}
.bf-f>span{font:11px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.bf-f input:not([type=radio]),.bf-f textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;width:100%;box-sizing:border-box;background:#fff;color:var(--text)}
.bf-slots input[type=radio]{width:auto;flex:none;margin:0}
.bf-f textarea{resize:vertical}
.bf-f em{font-style:normal}
.bf-slots{display:grid;gap:4px}.bf-slots label{display:flex;gap:6px;align-items:center;font-size:13px}
.bf-send{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bf-send button{border:1px solid var(--text);background:var(--text);color:#fff;border-radius:8px;font-size:13px;padding:6px 14px;cursor:pointer}
.bf-pre b{display:block;font:11px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}
.bf-pre p{margin:0}.bf-pre ul{margin:2px 0 0;padding-left:18px}
.bf-refs li{margin:2px 0}.bf-refs a{color:inherit}.bf-refs em{font-style:normal;opacity:.7;margin-left:6px}
.bf-undo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel-2);border-radius:8px;padding:6px 10px;margin:0 0 8px;font-size:13px;color:var(--muted)}
.bf-undo button{border:0;background:none;color:var(--text);font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
.bf-think{border-left:3px solid var(--text);padding:2px 0 2px 10px;margin:0 0 6px}
.bf-risk{background:#fdecea;border-left:3px solid #b3261e;border-radius:6px;padding:8px 12px;margin:0 0 6px}
.bf-ask{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.bf-ask h2{font:11px var(--mono);letter-spacing:1.2px;color:var(--muted);margin:0 0 8px}
.bf-qrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0}
.bf-qrow b{font-weight:500;margin-right:4px}
.bf-opt{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px;font-size:13px;cursor:pointer}
.bf-opt.on{background:var(--text);color:#fff;border-color:var(--text)}
.bf-qrow input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;min-width:140px}
.bf-qdone{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;color:var(--muted);font-size:13px}.bf-qdone b{color:var(--text);font-weight:500}.bf-qdone b:before{content:'→ ';color:var(--faint)}
.spk-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.spk-box[hidden]{display:none}
.spk-box h2{font:11px var(--mono);letter-spacing:1.2px;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.spk-hint{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.spk-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #f0f0f2}
.spk-row:first-of-type{border-top:0}
.spk-who{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:var(--panel-2);border-radius:6px;padding:2px 8px}
.spk-dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.spk-lines{color:var(--faint);font-size:12px}
.spk-name{font-weight:500}
.spk-samples{flex-basis:100%;min-width:0;display:flex;flex-direction:column;gap:4px;margin:2px 0 2px 2px}
.spk-clip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left;max-width:100%}
.spk-clip:hover{border-color:var(--live)}
.spk-clip .t{font:11px var(--mono);color:var(--muted);flex:none}
.spk-clip .q{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spk-acts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spk-acts button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:16px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer}
.spk-acts button:hover{border-color:var(--live)}
.spk-acts button.self{color:var(--muted)}
.spk-acts input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px;min-width:150px}
.spk-state{font-size:12px;color:var(--muted)}
.spk-state.bad{color:#b3261e}
.spk-done{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.spk-done b{color:var(--text);font-weight:500}
.spk-done button{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:999px;padding:3px 12px;font:inherit;font-size:12px;cursor:pointer}
.bf-tr summary{list-style:none;cursor:pointer}.bf-tr summary::-webkit-details-marker{display:none}
.bf-tr summary h2:after{content:"展开";margin-left:auto;font-size:11px}.bf-tr[open] summary h2:after{content:"收起"}
.md h1,.md h2,.md h3{font-size:14px;margin:14px 0 6px;text-transform:none;letter-spacing:0;color:var(--text);border:0;padding:0;font-family:inherit;display:block}
.md ul{padding-left:18px;margin:4px 0}.md table{border-collapse:collapse;font-size:13px}.md td,.md th{border:1px solid var(--line);padding:4px 8px}
.upd{border:1px solid var(--line,#ddd);border-radius:8px;padding:8px 10px;margin:0 0 8px;font-size:13px}
.upd.done{opacity:.65}
.upd-h{margin:0 0 4px}.upd-b{display:flex;flex-direction:column;gap:2px;margin:0 0 6px;line-height:1.45}
.upd-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.upd-in{flex:1 1 100%;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line,#ddd);border-radius:6px;background:var(--panel-2)}
.upd-foot{display:flex;gap:8px;margin:4px 0 0}.td-tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--panel-2);color:var(--muted)}.bf-note.bad{color:#b00020}
/* ===== 会后页 v2（0.6.20）：首屏只有三块 + 纪要；旧版全量视图收进「⋯」 ===== */
#legacy>*{display:none}
#legacy>.v2-show,body.v2-full #legacy>*{display:revert}
body.v2-full #legacy>[hidden]{display:none}
.v2-menu[hidden]{display:none}
.v2-menu{position:absolute;right:20px;top:52px;z-index:9;background:var(--panel,#fff);border:1px solid var(--line,#e5e5e8);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:6px;min-width:180px;display:flex;flex-direction:column}
.v2-menu button{border:0;background:none;text-align:left;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--text,#202124);border-radius:8px;cursor:pointer}
.v2-menu button:hover{background:var(--panel-2,#f0f0f3)}
.v2{display:flex;flex-direction:column;gap:12px;margin:0 0 24px}
.v2 h2{margin:0 0 6px;display:flex;align-items:center;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted,#76767c);text-transform:uppercase}
.v2 h2 .sp{flex:1}.v2 h2 .hint{font:11px var(--mono,monospace);color:var(--muted,#76767c);text-transform:none;letter-spacing:0;font-weight:400}
.v2 h2 .n{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--text,#202124);color:#fff;font:600 11px var(--mono,monospace);margin-right:8px;vertical-align:1px}
.v2-row{display:flex;gap:12px;align-items:baseline;padding:7px 14px;border:1px solid var(--line,#e5e5e8);border-radius:10px;background:var(--panel,#fff);font-size:15px;line-height:1.5}
.v2-row+.v2-row{margin-top:6px}
.v2-tag{flex:none;font:600 11px var(--mono,monospace);padding:2px 8px;border-radius:6px;background:var(--panel-2,#f0f0f3);color:var(--muted,#76767c)}
.v2-tag.k-问题{background:#fdecea;color:#b3261e}.v2-tag.k-进展{background:#e6f4ea;color:#1e7e34}.v2-tag.k-下一步{background:#e8f0fe;color:#1a56b8}
.v2-md{display:block;max-width:720px;margin:0 auto 16px;color:#1d1d1f;font:15.5px/1.72 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
.v2-md .md-story{padding:26px 0 24px;background:transparent;border-radius:0;border-top:1px solid #e5e5ea}
.v2-md .md-story:first-child{border-top:0;padding-top:8px}
.v2-md .md-story>*{max-width:680px}
.v2-md .md-no{display:none}
.v2-md .md-h{font:600 21px/1.38 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:-.01em;color:#111;margin:0 0 12px}
.v2-md b{font-weight:600;color:#111}
.v2-md code{font:13px var(--mono,monospace);background:#f0efe9;padding:1px 5px;border-radius:4px}
.v2-md .md-p{margin:0 0 10px}
.v2-md .md-lead{font:500 19px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#111;margin:0}
