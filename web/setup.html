<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听会台 · 首次设置</title><script src="bootstrap.js"></script><style>
body{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;color:#1d1d1f;margin:0}
main{max-width:560px;margin:40px auto;background:#fff;padding:28px 32px 32px;border-radius:24px}
.top{display:flex;align-items:flex-start;gap:12px}
h1{margin:0 0 4px;font-size:26px;flex:1}
.sub{color:#76767c;font-size:13px;margin:0 0 22px;line-height:1.6}
.seg{display:inline-flex;border:1px solid #d2d2d7;border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;color:#76767c;font:inherit;font-size:12px;padding:5px 10px;cursor:pointer;margin:0}
.seg button[aria-selected=true]{background:#1d1d1f;color:#fff;font-weight:600}
.step{border-top:1px solid #ececf0;padding:18px 0 4px}
.step:first-of-type{border-top:0;padding-top:0}
h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1d1d1f;color:#fff;font-size:12px;flex:0 0 auto}
.go{margin-left:auto;font-size:13px;font-weight:400;color:#c8102e}
label{display:block;margin:0 0 5px;font-size:13px;color:#48484d}
input{box-sizing:border-box;width:100%;padding:11px 12px;border:1px solid #d2d2d7;border-radius:10px;font:inherit;margin:0 0 12px}
details{margin:2px 0 6px;font-size:14px}
summary{cursor:pointer;color:#c8102e;font-size:14px;padding:4px 0}
details p,details li{color:#606068;font-size:13.5px;line-height:1.75}
details ol{padding-left:20px;margin:8px 0}
details a{color:#c8102e}
button,.button{display:inline-block;margin:0 8px 0 0;padding:11px 17px;border:0;border-radius:12px;background:#c8102e;color:#fff;font:inherit;cursor:pointer;text-decoration:none}
button.ghost,.button{background:#f0f0f2;color:#1d1d1f}
button:disabled{opacity:.5;cursor:wait}
.acts{border-top:1px solid #ececf0;padding-top:20px;margin-top:8px}
.cli{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:#48484d;min-height:34px}
.tag{font:11px ui-monospace,Menlo,monospace;padding:2px 8px;border-radius:999px;border:1px solid #e5e5e8;color:#76767c}
.tag.ok{color:#2f7d4f;border-color:#2f7d4f}
.msg{font-size:13px;line-height:1.6;margin:8px 0 0;color:#606068}
.msg.ok{color:#2f7d4f}.msg.bad{color:#b3261e}
.hint{color:#76767c;font-size:13px;line-height:1.7;margin:-4px 0 14px}
.pick{display:grid;gap:8px;margin:0 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #e5e5e8;border-radius:12px;padding:11px 13px;cursor:pointer;margin:0}
.opt:has(input:checked){border-color:#1d1d1f}
.opt input{width:auto;margin:2px 0 0;flex:0 0 auto}
.opt b{display:block;font-size:14px;font-weight:600}
.opt small{display:block;color:#76767c;font-size:12.5px;line-height:1.6;margin-top:3px}
#message{white-space:pre-line;font-size:14px;color:#48484d;margin:14px 0 0}
.foot{color:#8e8e94;font-size:12px;line-height:1.7;margin:18px 0 0}
input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #2877d4;outline-offset:3px}
@media(max-width:640px){main{margin:0;border-radius:0;padding:22px 20px 28px}}
</style></head><body><main>
<div class="top"><h1 data-t="h1"></h1><div class="seg" id="lang"><button type="button" data-l="zh">中文</button><button type="button" data-l="en">EN</button></div></div>
<p class="sub" data-t="sub"></p>
<form id="setup-form">

<section class="step">
  <h2><span class="n">1</span><span data-t="s1"></span><a class="go" id="volc-link" href="https://console.volcengine.com/speech/app" target="_blank" rel="noopener" data-t="s1go"></a></h2>
  <div class="pick" id="asr-pick">
    <label class="opt"><input type="radio" name="asr" value="volc" checked><span><b data-t="asr_volc"></b><small data-t="asr_volc_d"></small></span></label>
    <label class="opt"><input type="radio" name="asr" value="mac"><span><b data-t="asr_mac"></b><small data-t="asr_mac_d"></small></span></label>
    <label class="opt"><input type="radio" name="asr" value="deepgram"><span><b data-t="asr_dg"></b><small data-t="asr_dg_d"></small></span></label>
  </div>
  <div id="dg-fields" hidden>
    <p class="hint" data-t="dg_hint"></p>
    <label for="dg-key" data-t="l_dg"></label><input id="dg-key" name="DEEPGRAM_API_KEY" type="password" autocomplete="off">
  </div>
  <div id="volc-fields">
  <p class="hint" data-t="s1hint"></p>
  <label for="app" data-t="l_app"></label><input id="app" name="VOLC_APP_KEY" type="password" autocomplete="off">
  <label for="access" data-t="l_access"></label><input id="access" name="VOLC_ACCESS_KEY" type="password" autocomplete="off">
  </div>
  <details id="volc-how"><summary data-t="s1more"></summary><ol><li data-t="v1"></li><li data-t="v2"></li><li data-t="v3"></li></ol><p data-t="v_note"></p></details>
</section>

<section class="step" id="ai-step">
  <h2><span class="n">2</span><span data-t="s2"></span></h2>
  <div class="cli"><span id="cli-tag" class="tag" data-t="detecting"></span><span id="cli-actions"></span></div>
  <p class="msg" id="cli-msg"></p>
  <details id="key-block"><summary data-t="s2more"></summary>
    <ol><li data-t="d1"></li><li data-t="d2"></li><li data-t="d3"></li></ol>
    <label for="model-key" data-t="l_key"></label><input id="model-key" name="DEEPSEEK_API_KEY" type="password" autocomplete="off">
    <details><summary data-t="adv"></summary>
      <label for="base" data-t="l_base"></label><input id="base" name="LLM_BASE_URL" type="url">
      <label for="model" data-t="l_model"></label><input id="model" name="LLM_MODEL">
      <label for="resource" data-t="l_res"></label><input id="resource" name="VOLC_RESOURCE_ID">
    </details>
  </details>
</section>

<section class="step">
  <h2><span class="n">3</span><span data-t="s3"></span></h2>
  <p class="msg" data-t="s3d"></p>
  <button type="button" id="copy-prompt" data-t="s3btn"></button>
  <span class="msg" id="copy-msg"></span>
</section>

<div class="acts">
  <button type="submit" data-t="save"></button><button type="button" class="ghost" id="test" data-t="savetest"></button><a class="button" href="index.html" data-t="enter"></a>
</div>
</form>
<p id="message" role="status"></p>
<p class="foot" data-t="foot"></p>
</main><script src="setup.js"></script></body></html>
