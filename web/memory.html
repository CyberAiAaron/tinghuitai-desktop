<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听会台 · 会议记忆</title><script src="bootstrap.js"></script><style>
body{font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;color:#1d1d1f;margin:0}
main{max-width:900px;margin:32px auto;padding:0 20px 60px}
h1{font-size:24px;margin:0 0 6px}
.sub{color:#76767c;font-size:13px;margin:0 0 22px;line-height:1.7}
.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.tabs button{border:1px solid #d2d2d7;background:#fff;color:#48484d;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-selected=true]{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.card{background:#fff;border:1px solid #e8e8ec;border-left:3px solid #c8102e;border-radius:12px;padding:13px 15px;margin:0 0 10px}
.card.review{border-left-color:#e0a020;background:#fffdf7}
.card .t{font-size:15px;line-height:1.6}
.card .m{color:#8e8e94;font-size:12px;margin-top:6px;line-height:1.6}
.card .note{color:#a06a10;font-size:12.5px;margin-top:5px}
.card .acts{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
button.sm{border:1px solid #d2d2d7;background:#f5f5f7;border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
button.sm.p{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
textarea{width:100%;box-sizing:border-box;border:1px solid #d2d2d7;border-radius:8px;padding:9px;font:inherit;font-size:14px;resize:vertical}
.empty{color:#8e8e94;padding:40px 0;text-align:center}
#msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s}
#msg.on{opacity:1}
</style></head><body><main>
<h1>会议记忆</h1>
<p class="sub">每场会结束后自动从你说过的话里抽出来的，下一场开会时相关的会被自动翻出来给助手看。记错了就在这里改或作废，改完 Claude 那边的只读副本会同步更新。</p>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
</main><div id="msg"></div>
<script>
const KIND={decision:'决定',question:'未决',promise:'承诺',term:'术语'};
const STATE={active:'有效',superseded:'已被替代',revoked:'已作废',open:'未解决',resolved:'已解决',pending:'待完成',done:'已完成',cancelled:'已取消'};
let all=[],tab='all';
const tok=()=>window.THT_BOOT&&window.THT_BOOT.relayToken||'';
const toast=s=>{const m=document.getElementById('msg');m.textContent=s;m.className='on';setTimeout(()=>m.className='',1800);};
async function load(){
  const r=await fetch('/asr-relay/memory?token='+encodeURIComponent(tok()),{cache:'no-store'});
  const j=await r.json();
  if(!j.ok){document.getElementById('list').innerHTML='<p class="empty">'+(j.error||'读不到')+'</p>';return;}
  all=j.cards||[]; render();
}
function render(){
  const t=document.getElementById('tabs');
  const counts={all:all.length,review:all.filter(c=>c.needs_review).length};
  for(const k of Object.keys(KIND)) counts[k]=all.filter(c=>c.kind===k).length;
  t.innerHTML='';
  const mk=(key,label)=>{const b=document.createElement('button');b.textContent=label+'（'+(counts[key]||0)+'）';b.setAttribute('aria-selected',String(tab===key));b.onclick=()=>{tab=key;render();};t.appendChild(b);};
  mk('all','全部'); mk('review','待你核对'); for(const [k,v] of Object.entries(KIND)) mk(k,v);
  let rows=all;
  if(tab==='review') rows=all.filter(c=>c.needs_review); else if(tab!=='all') rows=all.filter(c=>c.kind===tab);
  const box=document.getElementById('list');
  if(!rows.length){box.innerHTML='<p class="empty">这里还没有内容。开一场会，结束后就会自动出现。</p>';return;}
  box.innerHTML='';
  for(const c of rows){
    const d=document.createElement('div'); d.className='card'+(c.needs_review?' review':'');
    const meta=[KIND[c.kind]||c.kind, STATE[c.state]||c.state, c.owner||'', c.due?('截止 '+c.due):'', '来自《'+(c.meeting_title||c.meeting_id)+'》', String(c.recorded_at).slice(0,10)].filter(Boolean).join(' · ');
    d.innerHTML='<div class="t"></div><div class="m"></div>'+(c.needs_review?'<div class="note"></div>':'')+'<div class="acts"></div>';
    d.querySelector('.t').textContent=c.text;
    d.querySelector('.m').textContent=meta;
    if(c.needs_review) d.querySelector('.note').textContent='⚠️ '+(c.review_note||'等你核对');
    const acts=d.querySelector('.acts');
    const bEdit=document.createElement('button'); bEdit.className='sm'; bEdit.textContent='改'; acts.appendChild(bEdit);
    const bOk=document.createElement('button'); bOk.className='sm'; bOk.textContent=c.needs_review?'没问题':'确认无误'; acts.appendChild(bOk);
    const bDrop=document.createElement('button'); bDrop.className='sm'; bDrop.textContent='作废'; acts.appendChild(bDrop);
    bEdit.onclick=()=>{
      const ta=document.createElement('textarea'); ta.rows=3; ta.value=c.text;
      const save=document.createElement('button'); save.className='sm p'; save.textContent='保存';
      const cancel=document.createElement('button'); cancel.className='sm'; cancel.textContent='取消';
      acts.innerHTML=''; d.querySelector('.t').replaceWith(ta); acts.append(save,cancel);
      cancel.onclick=()=>render();
      save.onclick=()=>post({action:'update',id:c.id,text:ta.value.trim()},'改好了');
    };
    bOk.onclick=()=>post({action:'update',id:c.id,text:c.text},'标成你确认过了');
    bDrop.onclick=()=>{ if(confirm('作废这条？以后开会不会再被翻出来。')) post({action:'drop',id:c.id},'已作废'); };
    box.appendChild(d);
  }
}
async function post(body,okMsg){
  try{
    const r=await fetch('/asr-relay/memory?token='+encodeURIComponent(tok()),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!j.ok) return toast(j.error||'没成功');
    toast(okMsg); await load();
  }catch(e){ toast('没成功：'+e.message); }
}
load();
</script></body></html>
